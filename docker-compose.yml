services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-dbtasks}
      POSTGRES_USER: ${DB_USER:-dbtasks}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dbtasks} -d ${DB_NAME:-dbtasks}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${DB_PORT_PUBLISHED:-5432}:5432"

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-dbtasks}
      DB_USER: ${DB_USER:-dbtasks}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    ports:
      - "${API_PORT:-4000}:4000"

volumes:
  db-data:
